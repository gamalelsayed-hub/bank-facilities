name: حذف إصدار

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'اسم الإصدار (الوسم) المراد حذفه'
        required: true

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete release and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "${{ inputs.tag }}" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
