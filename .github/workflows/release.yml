name: بناء نسخة ويندوز ونشرها

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Windows zip
        run: ./build-windows.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then TAG="build-$(date +%Y%m%d-%H%M)"; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/BankFacilities-Windows.zip --clobber
          else
            gh release create "$TAG" dist/BankFacilities-Windows.zip \
              --title "الإصدار ${TAG#v}" \
              --notes "حمّل BankFacilities-Windows.zip، فك الضغط، وشغّل BankFacilities.exe. التعليمات في ملف «اقرأني» داخل المجلد."
          fi
