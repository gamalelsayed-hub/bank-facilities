<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>إدارة التسهيلات البنكية</title>
<style>
:root{
  --bg:#F3F6F5; --surface:#FFFFFF; --sunk:#EAF0EE; --ink:#13211D; --muted:#5B6B66; --line:#D8E1DE;
  --accent:#0E6B5B; --accent-ink:#FFFFFF; --accent-soft:#DCEFEA;
  --danger:#B42318; --danger-soft:#FDECEA; --warn:#A15C07; --warn-soft:#FDF1DC; --ok:#16754A; --ok-soft:#E3F4EA;
  --bar-p:#0E6B5B; --bar-f:#8CC3B6;
  --font:"Segoe UI","Tahoma","Arial",sans-serif;
  --r:8px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0E1513; --surface:#151F1C; --sunk:#1B2824; --ink:#E4EEEA; --muted:#93A6A0; --line:#2A3A35;
  --accent:#4FB8A1; --accent-ink:#06120F; --accent-soft:#17362F;
  --danger:#F2867B; --danger-soft:#3A1A17; --warn:#E9B25C; --warn-soft:#352812; --ok:#6BCB95; --ok-soft:#14301F;
  --bar-p:#4FB8A1; --bar-f:#2A6458; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.6}
.num,td.n,.kpi b{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
h1,h2,h3{margin:0;font-weight:600}
h1{font-size:19px} h2{font-size:16px} h3{font-size:14px}
.app{display:grid;grid-template-columns:210px 1fr;min-height:100vh}
aside{background:var(--surface);border-inline-end:1px solid var(--line);padding:18px 10px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
aside .brand{padding:0 10px 14px;border-bottom:1px solid var(--line);margin-bottom:8px}
aside .brand small{display:block;color:var(--muted);font-size:12px}
aside button{border:0;background:none;font:inherit;color:var(--ink);text-align:right;padding:9px 12px;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:space-between}
aside button:hover{background:var(--sunk)}
aside button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
aside .sep{height:1px;background:var(--line);margin:8px 4px}
aside .foot{margin-top:auto;font-size:11.5px;color:var(--muted);padding:0 10px;word-break:break-all}
.cnt{min-width:20px;padding:0 6px;border-radius:10px;background:var(--danger);color:#fff;font-size:11px;line-height:18px;text-align:center}
main{padding:20px 24px 48px;display:flex;flex-direction:column;gap:18px;min-width:0}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ph p{margin:0;color:var(--muted);font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi span{color:var(--muted);font-size:12.5px}
.kpi b{font-size:20px;font-weight:600;text-align:right}
.kpi em{font-style:normal;font-size:12px;color:var(--muted)}
.kpi.bad b{color:var(--danger)} .kpi.warn b{color:var(--warn)}
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:6px;border-inline-start:4px solid;font-size:13.5px}
.alert.bad{background:var(--danger-soft);border-color:var(--danger)}
.alert.warn{background:var(--warn-soft);border-color:var(--warn)}
.alert.info{background:var(--accent-soft);border-color:var(--accent)}
.alert button{margin-inline-start:auto}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{background:var(--sunk);color:var(--muted);font-weight:500;text-align:right;padding:8px 10px;white-space:nowrap;font-size:12.5px}
td{padding:7px 10px;border-top:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:left;white-space:nowrap}
tr.tot td{font-weight:600;background:var(--sunk)}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunk)}
tr.open-row td{background:var(--accent-soft)}
.pill{display:inline-block;padding:1px 9px;border-radius:12px;font-size:12px;white-space:nowrap;font-weight:500}
.p-bad{background:var(--danger-soft);color:var(--danger)} .p-warn{background:var(--warn-soft);color:var(--warn)}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-mut{background:var(--sunk);color:var(--muted)} .p-acc{background:var(--accent-soft);color:var(--accent)}
.meter{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;min-width:90px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:4px}
.meter.warn i{background:var(--warn)} .meter.bad i{background:var(--danger)}
.btn{font:inherit;font-weight:500;border-radius:6px;padding:6px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:2px 10px;font-size:12.5px}
.btn.dng{color:var(--danger);border-color:var(--danger)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
form,.form{display:flex;flex-direction:column;gap:16px}
fieldset{border:1px solid var(--line);border-radius:6px;padding:12px 14px 14px;margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;min-width:0}
legend{font-weight:600;padding:0 6px;font-size:13.5px}
label.f,.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);min-width:0}
.f.wide{grid-column:1/-1}
input,select,textarea{font:inherit;font-size:13.5px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 9px;width:100%;min-width:0}
input[type=number],input[type=date],input.ltr{direction:ltr;text-align:right}
input[type=checkbox],input[type=radio]{width:auto}
textarea{min-height:100px;direction:ltr;text-align:left;font-family:Consolas,monospace;font-size:12.5px}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;width:fit-content;max-width:100%;flex-wrap:wrap}
.seg label{padding:5px 12px;cursor:pointer;font-size:13px;color:var(--ink);display:flex;gap:6px;align-items:center}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg label:has(input:checked){background:var(--accent);color:var(--accent-ink)}
.seg label:has(input:disabled){opacity:.4;cursor:not-allowed;text-decoration:line-through}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink)}
.note{font-size:12.5px;color:var(--muted);margin:0}
.calc{background:var(--sunk);border-radius:6px;padding:12px 14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.calc div{display:flex;flex-direction:column}
.calc span{font-size:12px;color:var(--muted)} .calc b{font-weight:600}
.msg{padding:9px 12px;border-radius:6px;font-size:13.5px}
.msg.ok{background:var(--ok-soft);color:var(--ok)} .msg.bad{background:var(--danger-soft);color:var(--danger)} .msg.warn{background:var(--warn-soft);color:var(--warn)}
.msgs{display:flex;flex-direction:column;gap:6px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.detail{display:flex;flex-direction:column;gap:12px;padding:6px 2px 10px}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--font)}
.chart .gl{stroke:var(--line)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:5px;vertical-align:middle}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:6px;font-size:13.5px;z-index:20}
.muted{color:var(--muted)}
#printHead,#printArea{display:none}
.backbtn{margin:0 6px 10px;justify-content:center!important;border:1px solid var(--line)!important;font-size:13px}
.backbtn:disabled{opacity:.4;cursor:not-allowed}
tr.bank-h td{background:var(--accent-soft);font-weight:600;color:var(--accent)}
tr.sub td{font-weight:600;border-top:2px solid var(--line)}
@media print{
  :root{--bg:#fff;--surface:#fff;--sunk:#EEF2F1;--ink:#111;--muted:#444;--line:#C9D3D0;--accent:#0E6B5B;--accent-soft:#E3F1ED;--danger:#B42318;--danger-soft:#FDECEA;--warn:#8A4B00;--warn-soft:#FDF1DC;--ok:#16754A;--ok-soft:#E3F4EA;--bar-p:#0E6B5B;--bar-f:#8CC3B6;color-scheme:light}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{background:#fff;font-size:11px}
  aside,.btn,.toast,.stickybar,.noprint,input[type=radio],.seg{display:none!important}
  .app{display:block;min-height:0} main{padding:0;gap:10px}
  section.panel{border:0;padding:0;gap:8px}
  .tw{overflow:visible;border:1px solid var(--line)}
  table{font-size:8.5px;width:100%;table-layout:auto} td,th{padding:3px 4px} th{white-space:normal} td{word-break:break-word}
  .ph:has(.noprint) h2{display:none}
  .pill{padding:0 4px;font-size:8px}
  tr{break-inside:avoid} thead{display:table-header-group}
  .grid2{display:block} .grid2>section{margin-bottom:10px}
  .kpis{grid-template-columns:repeat(6,1fr)} .kpi b{font-size:14px}
  .alert button{display:none}
  .row input,.row select{border:0;background:none;padding:0;width:auto;appearance:none}
  #printHead{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--accent);padding-bottom:6px;margin-bottom:10px}
  #printHead h1{font-size:17px;margin:2px 0} #printHead .ph-sub{color:var(--muted)}
  body.pa main{display:none} body.pa #printArea{display:block}
  #printArea .detail{padding:0}
}
.bankbar{display:flex;gap:8px;flex-wrap:wrap}
.bankcard{border:1px solid var(--line);border-radius:8px;padding:10px 14px;background:var(--surface);cursor:pointer;min-width:170px;text-align:right;font:inherit;color:var(--ink);display:flex;flex-direction:column;gap:2px}
.bankcard[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.bankcard b{font-size:14.5px} .bankcard span{font-size:12px;color:var(--muted)}
.bankcard.off{opacity:.55}
.fac{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.fac.off{opacity:.6}
.fac .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.fac h4{margin:0;font-size:13px;color:var(--muted);font-weight:600;grid-column:1/-1;border-top:1px dashed var(--line);padding-top:8px}
.listedit td input,.listedit td select{min-width:90px}
details summary{cursor:pointer;color:var(--accent);font-size:13px}
.log{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto}
.log div{border-inline-start:2px solid var(--line);padding-inline-start:8px}
.stickybar{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 0 2px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
</style>
</head>
<body>
<div id="printHead"></div><div id="printArea"></div>
<div class="app">
  <aside>
    <div class="brand"><h1>إدارة التسهيلات</h1><small id="company"></small><small id="today"></small></div>
    <button class="backbtn" id="backBtn" disabled title="رجوع للشاشة السابقة (Alt + ←)">→ رجوع</button>
    <nav id="nav" style="display:flex;flex-direction:column;gap:2px">
      <button data-v="dash" aria-current="true">لوحة المتابعة</button>
      <button data-v="due">الاستحقاقات والتنبيهات<span class="cnt" id="dueCnt" hidden></span></button>
      <button data-v="new">قرض / تمويل جديد</button>
      <button data-v="pay">تسجيل سداد</button>
      <button data-v="loans">سجل القروض</button>
      <button data-v="report">تقرير القروض بالبنك</button>
      <div class="sep"></div>
      <button data-v="banks">البنوك والشروط</button>
      <button data-v="settings">الإعدادات</button>
    </nav>
    <div class="foot" id="foot"></div>
  </aside>
  <main id="view"><section class="panel"><div class="empty">جاري تحميل البيانات…</div></section></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* ======================= state & helpers ======================= */
const DEF={companyName:'',alertDays:30,urgentDays:7,renewalAlertDays:60,utilWarn:90,ladderMonths:6,notifyOnStart:true,
  currencies:[{code:'SAR',name:'ريال سعودي',rate:1,base:true},{code:'USD',name:'دولار أمريكي',rate:3.75}],
  benchmarks:[],weekendDays:[5,6],holidays:[],shiftRule:'next',paymentMethods:['تحويل بنكي'],customFields:[],
  facilityTypes:[{id:'short',name:'تمويل قصير الأجل',behavior:'short'},{id:'lc',name:'اعتمادات مستندية',behavior:'lc'},{id:'lcf',name:'تمويل اعتمادات',behavior:'lcf'},{id:'long',name:'قرض طويل الأجل',behavior:'long'}]};
const BEH={short:'تمويل / قرض قصير',long:'قرض طويل الأجل',lc:'اعتماد مستندي',lcf:'تمويل اعتماد'};
const STYLE={conventional:'تقليدي (فائدة)',murabaha:'مرابحة',tawarruq:'تورق',ijara:'إجارة'};
const RATE={manual:'يدوي من كشف البنك',fixed:'نسبة ثابتة',benchmark:'مؤشر + هامش (سايبور…)'};
const SHIFT={next:'أول يوم عمل بعده',prev:'آخر يوم عمل قبله',none:'بدون ترحيل'};
const WD=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const S={loans:[],banks:[],settings:{...DEF},facs:[],user:'',dataDir:'',view:'dash',
  dueMode:'period',dueDays:null,dueMonth:null,dueBank:'',openLoan:null,lf:{bank:'',status:'active',term:'',q:''},
  selBank:null,bankEdit:null,bankDirty:false,setEdit:null,setDirty:false,pm:null,nlPrefill:null,notified:false};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=n=>Math.round((+n||0)*100)/100;
const fmt=(n,d=2)=>(+n||0).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const fmt0=n=>fmt(n,0);
const pad=n=>String(n).padStart(2,'0');
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const P=s=>{const [y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)};
const D=t=>{const d=new Date(t);return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())};
const days=(a,b)=>Math.round((P(b)-P(a))/864e5);
const addDays=(s,n)=>D(P(s)+n*864e5);
function addMonths(s,n){const [y,m,d]=s.split('-').map(Number);const t=new Date(Date.UTC(y,m-1+n,1));const last=new Date(Date.UTC(t.getUTCFullYear(),t.getUTCMonth()+1,0)).getUTCDate();t.setUTCDate(Math.min(d,last));return D(t)}
const fmtD=s=>s?s.split('-').reverse().join('/'):'—';
const AR_M=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const clone=o=>JSON.parse(JSON.stringify(o));
const rid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2800)}

/* ---- lookups ---- */
const bankById=id=>S.banks.find(b=>b.id===id);
const facById=id=>S.facs.find(f=>f.id===id);
const typeById=id=>S.settings.facilityTypes.find(t=>t.id===id);
const behaviorOf=typeId=>typeById(typeId)?.behavior||'short';
const cur=code=>S.settings.currencies.find(c=>c.code===code);
const curName=code=>cur(code)?.name||code;
const baseCur=()=>S.settings.currencies.find(c=>c.base)?.code||'SAR';
function benchRate(id,at){const b=S.settings.benchmarks.find(x=>x.id===id);if(!b)return null;const h=(b.history||[]).filter(x=>!at||x.date<=at).sort((a,c)=>a.date<c.date?-1:1);return h.length?h[h.length-1]:null}
function shiftDate(s,bank){
  const rule=(bank&&bank.shiftRule&&bank.shiftRule!=='default')?bank.shiftRule:S.settings.shiftRule;if(rule==='none')return s;
  const wk=new Set(S.settings.weekendDays||[]),hol=new Set((S.settings.holidays||[]).map(h=>h.date));let t=P(s);
  for(let i=0;i<30;i++){const d=D(t);if(!wk.has(new Date(t).getUTCDay())&&!hol.has(d))return d;t+=(rule==='prev'?-1:1)*864e5}return s;
}

/* ---- data in/out ---- */
function applyData(d){
  S.settings={...DEF,...(d.settings||{})};
  S.banks=Object.entries(d.banks||{}).map(([id,v])=>({id,...v})).sort((a,b)=>(a.order||99)-(b.order||99));
  S.facs=S.banks.flatMap(b=>(b.facilities||[]).map(f=>({...f,bankId:b.id,bank:b.name,kind:f.label,parent:f.parentId,behavior:behaviorOf(f.typeId),bankActive:b.active!==false})));
  S.loans=Object.entries(d.loans||{}).map(([id,v])=>{const l={id,...v};const b=bankById(l.bankId);if(b)l.bank=b.name;const f=facById(l.facilityId);if(f){l.facility=f.label}return l});
}
async function save(ops,okMsg){
  try{const d=await window.api.batch(ops);applyData(d);if(okMsg)toast(okMsg);return true}
  catch(e){toast('تعذّر الحفظ: '+e.message);return false}
}
const putLoan=(id,doc)=>{const c=clone(doc);delete c.id;return {col:'loans',id,doc:c}};

/* ---- loan math ---- */
const remP=l=>Math.max(0,r2(l.principal-(l.paidPrincipal||0)));
const remF=l=>Math.max(0,r2(l.profit-(l.paidProfit||0)));
function lineState(l){if(remP(l)<=0.005&&remF(l)<=0.005)return'paid';if((l.paidPrincipal||0)+(l.paidProfit||0)>0)return'partial';return'open'}
const outstanding=loan=>r2(loan.lines.reduce((a,l)=>a+remP(l),0));
const remProfit=loan=>r2(loan.lines.reduce((a,l)=>a+remF(l),0));
const isActive=loan=>loan.lines.some(l=>lineState(l)!=='paid');
const nextLine=loan=>loan.lines.filter(l=>lineState(l)!=='paid').sort((a,b)=>a.due<b.due?-1:1)[0];
const totalPrincipal=loan=>r2(loan.lines.reduce((a,l)=>a+l.principal,0));
const totalProfit=loan=>r2(loan.lines.reduce((a,l)=>a+l.profit+(l.waived||0),0));
function impliedRate(start,amount,lines){
  if(!start||!amount||!lines.length)return null;
  const cf=lines.filter(l=>l.due).map(l=>({t:days(start,l.due)/(365/12),v:l.principal+l.profit+(l.waived||0)}));
  if(cf.some(c=>c.t<=0))return null;
  const f=r=>cf.reduce((a,c)=>a+c.v*Math.pow(1+r/12,-c.t),0)-amount;
  let lo=0,hi=1;if(f(lo)<0)return 0;if(f(hi)>0)return null;
  for(let i=0;i<80;i++){const m=(lo+hi)/2;f(m)>0?lo=m:hi=m}return (lo+hi)/2;
}
const loanRate=loan=>impliedRate(loan.start,totalPrincipal(loan),loan.lines);
function limitStats(){
  const m={};S.facs.forEach(l=>m[l.id]={...l,own:0,used:0,avail:0,children:[]});
  S.loans.forEach(ln=>{if(ln.limitId&&m[ln.limitId])m[ln.limitId].own+=outstanding(ln)});
  Object.values(m).forEach(l=>{if(l.parent&&m[l.parent])m[l.parent].children.push(l.id)});
  Object.values(m).forEach(l=>{l.used=l.own+l.children.reduce((a,c)=>a+m[c].own,0);l.avail=l.limit-l.used});
  Object.values(m).forEach(l=>{if(l.parent&&m[l.parent]){l.avail=Math.min(l.limit-l.own,m[l.parent].avail);l.used=l.own}});
  return m;
}

function ladderSVG(lad){
  const W=620,H=220,l=70,r=10,tp=14,b=34,max=Math.max(1,...lad.map(x=>x.p+x.f));
  const step=niceStep(max/4),top=Math.ceil(max/step)*step,bw=(W-l-r)/lad.length;const y=v=>tp+(H-tp-b)*(1-v/top);
  let g='';for(let v=0;v<=top+1;v+=step)g+=`<line class="gl" x1="${l}" x2="${W-r}" y1="${y(v)}" y2="${y(v)}"/><text x="${l-6}" y="${y(v)+4}" text-anchor="end">${short(v)}</text>`;
  lad.forEach((x,i)=>{const cx=W-r-bw*(i+.5),w=Math.min(46,bw*.6);
    g+=`<rect x="${cx-w/2}" y="${y(x.p)}" width="${w}" height="${y(0)-y(x.p)}" fill="var(--bar-p)" rx="2"><title>أصل ${fmt(x.p)}</title></rect>`;
    g+=`<rect x="${cx-w/2}" y="${y(x.p+x.f)}" width="${w}" height="${y(x.p)-y(x.p+x.f)}" fill="var(--bar-f)"><title>ربح ${fmt(x.f)}</title></rect>`;
    if(x.p+x.f>0)g+=`<text x="${cx}" y="${y(x.p+x.f)-4}" text-anchor="middle" style="fill:var(--ink)">${short(x.p+x.f)}</text>`;
    g+=`<text x="${cx}" y="${H-b+16}" text-anchor="middle">${AR_M[+x.m.slice(5)-1]}</text><text x="${cx}" y="${H-b+29}" text-anchor="middle">${x.n} استحقاق</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="سلم الاستحقاقات">${g}</svg>`;
}
function niceStep(x){const p=Math.pow(10,Math.floor(Math.log10(x||1))),n=x/p;return(n<=1?1:n<=2?2:n<=5?5:10)*p}
function short(v){return v>=1e6?(v/1e6).toFixed(2).replace(/\.?0+$/,'')+'M':v>=1e3?Math.round(v/1e3)+'K':String(Math.round(v))}

function parsePaste(txt){
  const out=[],bad=[];txt.split(/\r?\n/).forEach((ln,i)=>{ln=ln.trim();if(!ln)return;const c=ln.split(/[\t;]+|\s+/).map(s=>s.trim()).filter(Boolean);
    if(c.length<2){bad.push(i+1);return}let d=c[0],m;
    if(m=d.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})$/))d=`${m[1]}-${pad(m[2])}-${pad(m[3])}`;else if(m=d.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})$/))d=`${m[3]}-${pad(m[2])}-${pad(m[1])}`;else{bad.push(i+1);return}
    const n=s=>+String(s||'0').replace(/[^\d.-]/g,'');out.push({due:d,principal:r2(n(c[1])),profit:r2(n(c[2]))})});

function nlSchedule(f,bank){
  const amt=r2(f.amount*(f.cur===baseCur()?1:f.fx));const sh=s=>f.shift?shiftDate(s,bank):s;
  if(f.sched==='bank'){const {out,bad}=parsePaste(f.paste);return{lines:out,amt,err:bad.length?'أسطر غير مفهومة في الجدول: '+bad.join('، '):null}}
  if(!amt||!f.start)return{lines:[],amt};
  let dues=[];
  if(f.repay==='bullet'){const d=f.sched==='manual'?f.due:(f.unit==='d'?addDays(f.start,f.period):addMonths(f.start,f.period));if(!d)return{lines:[],amt};dues=[sh(d)]}
  else{const n=f.unit==='d'?Math.max(1,Math.round(f.period/30)):f.period;for(let i=1;i<=n;i++)dues.push(sh(addMonths(f.start,i)))}
  const n=dues.length;let lines=[];
  if(f.pm==='rate'&&f.repay==='installments'&&f.method==='annuity'&&f.rate>0){
    const i=f.rate/12,pay=amt*i/(1-Math.pow(1+i,-n));let bal=amt;
    dues.forEach((d,k)=>{const pf=r2(bal*i),pp=k===n-1?r2(bal):r2(pay-pf);lines.push({due:d,principal:pp,profit:pf});bal=r2(bal-pp)});return{lines,amt};
  }
  const base=r2(amt/n);let bal=amt,prev=f.start;
  dues.forEach((d,k)=>{const pp=k===n-1?r2(amt-base*(n-1)):base;lines.push({due:d,principal:pp,profit:0,w:bal*Math.max(0,days(prev,d))});bal-=pp;prev=d});
  if(f.pm==='rate')lines.forEach(l=>l.profit=r2(l.w*f.rate/f.basis));

  lines.forEach(l=>delete l.w);return{lines,amt};
}

function pmFillLoans(pick){
  const sel=$('#pm-loan');if(!sel)return;const cv=pick||sel.value,b=$('#pm-bank').value;
  const ls=S.loans.filter(l=>isActive(l)&&(!b||l.bank===b)).sort((a,c)=>(nextLine(a)?.due||'')<(nextLine(c)?.due||'')?-1:1);
  sel.innerHTML=ls.length?ls.map(l=>`<option value="${l.id}">${esc(l.bank)} — ${esc(l.name)} — قائم ${fmt(outstanding(l))} — أقرب استحقاق ${fmtD(nextLine(l)?.due)}</option>`).join(''):'<option value="">لا توجد قروض قائمة</option>';
  if(ls.some(l=>l.id===cv))sel.value=cv;
  if(sel.dataset.last!==sel.value){sel.dataset.last=sel.value;pmFillLines()}
}
function pmFillLines(pick){
  const loan=S.loans.find(l=>l.id===$('#pm-loan').value),sel=$('#pm-line');if(!loan){sel.innerHTML='';return}
  const cv=pick!=null?String(pick):sel.value;
  const open=loan.lines.map((l,i)=>({l,i})).filter(x=>lineState(x.l)!=='paid');
  sel.innerHTML=open.map(x=>`<option value="${x.i}">${fmtD(x.l.due)} — أصل ${fmt(remP(x.l))} + ربح ${fmt(remF(x.l))} = ${fmt(remP(x.l)+remF(x.l))}${x.l.due<todayStr()?' (متأخر)':''}</option>`).join('');
  if(open.some(x=>String(x.i)===cv))sel.value=cv;S.pmKey='';
}
function pmUpdate(force){
  if(!$('#pmForm'))return;const loan=S.loans.find(l=>l.id===$('#pm-loan').value);
  const scope=document.querySelector('input[name="pm-scope"]:checked').value;
  const fac=loan&&facById(loan.facilityId),canConv=!!(loan&&loan.behavior==='lc'&&fac?.convertible&&scope==='line');
  $('#w-line').hidden=scope==='all';$('#w-conv').hidden=!canConv;
  if(!canConv)document.querySelector('input[name="pm-method"][value="cash"]').checked=true;
  const method=document.querySelector('input[name="pm-method"]:checked').value;
  if(!loan){$('#pm-calc').innerHTML='';return}
  const key=loan.id+'|'+scope+'|'+$('#pm-line').value+'|'+method;
  if(force||S.pmKey!==key){S.pmKey=key;
    if(scope==='all'){$('#pm-principal').value=outstanding(loan).toFixed(2);const due=loan.lines.filter(l=>lineState(l)!=='paid'&&l.due<=$('#pm-date').value);$('#pm-profit').value=r2(due.reduce((a,l)=>a+remF(l),0)).toFixed(2)}
    else{const l=loan.lines[+$('#pm-line').value];if(l){$('#pm-principal').value=remP(l).toFixed(2);$('#pm-profit').value=(method==='convert'?0:remF(l)).toFixed(2)}}
  }
  $('#pm-principal').readOnly=scope==='all';
  const L=limitStats(),lim=L[loan.limitId],pp=+$('#pm-principal').value||0,pf=+$('#pm-profit').value||0;
  $('#pm-calc').innerHTML=`<div><span>رصيد القرض القائم</span><b class="num">${fmt(outstanding(loan))}</b></div><div><span>الربح المتبقي</span><b class="num">${fmt(remProfit(loan))}</b></div><div><span>إجمالي هذا السداد</span><b class="num">${fmt(pp+pf)}</b></div>${lim&&!lim.noLimit?`<div><span>المتاح في ${esc(lim.label)} بعد السداد</span><b class="num">${fmt(lim.avail+pp)}</b></div>`:''}`;
  const tgt=fac?.lcfTargetId&&facById(fac.lcfTargetId);
  $('#pm-msg').innerHTML=scope==='all'?`<div class="msg warn">سيُسدد كامل الأصل القائم. الربح المدخل يُوزع على الأقساط بالترتيب، وأي ربح مستقبلي متبقٍ يُسجل كخصم سداد مبكر.</div>`:method==='convert'?`<div class="msg warn">سيُقفل الاعتماد ويتحرر حده، ثم تنتقل لشاشة قرض جديد لتسجيل تمويل الاعتماد على «${esc(tgt?tgt.label:'نفس الحد')}».</div>`:'';
}
document.addEventListener('input',e=>{if(e.target.closest('#pmForm')&&['pm-principal','pm-profit','pm-note'].includes(e.target.id))pmUpdate()});
document.addEventListener('change',e=>{if(!e.target.closest('#pmForm'))return;
  if(e.target.id==='pm-bank')pmFillLoans();else if(e.target.id==='pm-loan'){e.target.dataset.last=e.target.value;pmFillLines()}
  if(e.target.id==='pm-date')S.pmKey='';pmUpdate()});
document.addEventListener('submit',async e=>{
  if(e.target.id!=='pmForm')return;e.preventDefault();
  const loan=S.loans.find(l=>l.id===$('#pm-loan').value),msg=$('#pm-msg');const fail=m=>msg.innerHTML=`<div class="msg bad">${esc(m)}</div>`;
  if(!loan)return fail('اختر قرضاً.');
  const scope=document.querySelector('input[name="pm-scope"]:checked').value,method=$('#w-conv').hidden?'cash':document.querySelector('input[name="pm-method"]:checked').value;
  const date=$('#pm-date').value,pp=r2(+$('#pm-principal').value||0),pf=r2(+$('#pm-profit').value||0);
  if(!date)return fail('حدد تاريخ السداد.');if(pp<0||pf<0||pp+pf<=0)return fail('أدخل مبلغ السداد.');
  const c=clone(loan);const alloc=[];
  if(scope==='line'){const i=+$('#pm-line').value,l=c.lines[i];if(!l)return fail('اختر القسط.');
    if(pp>remP(l)+0.005)return fail(`المسدد من الأصل أكبر من المتبقي (${fmt(remP(l))}).`);
    l.paidPrincipal=r2((l.paidPrincipal||0)+pp);l.paidProfit=r2((l.paidProfit||0)+pf);l.paidDate=date;let w=0;
    if(method==='convert'&&remF(l)>0){w=remF(l);l.waived=r2((l.waived||0)+w);l.profit=r2(l.profit-w)}
    alloc.push({i,p:pp,f:pf,w});
  }else{let leftF=pf;c.lines.forEach((l,i)=>{if(lineState(l)==='paid')return;const p=remP(l),f=Math.min(remF(l),leftF);leftF=r2(leftF-f);
      l.paidPrincipal=r2((l.paidPrincipal||0)+p);l.paidProfit=r2((l.paidProfit||0)+f);l.paidDate=date;const w=remF(l);if(w>0){l.waived=r2((l.waived||0)+w);l.profit=r2(l.profit-w)}alloc.push({i,p,f,w})});
    if(leftF>0.005&&alloc.length){const a=alloc[alloc.length-1];a.f=r2(a.f+leftF);const l=c.lines[a.i];l.paidProfit=r2(l.paidProfit+leftF);l.profit=r2(l.profit+leftF)}}
  c.payments=[...(c.payments||[]),{id:rid('p'),date,principal:pp,profit:pf,scope,method,payMethod:$('#pm-pay').value||null,note:$('#pm-note').value.trim()||null,alloc,by:S.user,at:new Date().toISOString()}];
  $('#pm-save').disabled=true;
  if(await save([putLoan(loan.id,c)],'تم تسجيل السداد')){
    if(method==='convert'){const fac=facById(loan.facilityId);const tgt=facById(fac?.lcfTargetId)||fac;
      S.nlPrefill={bankId:loan.bankId,facilityId:tgt?.id,amount:pp,start:date,name:'تمويل اعتماد '+loan.name,convertedFrom:loan.id,fromName:loan.name};setView('new')}
    else{S.pm={loan:loan.id};vPay()}
  }else $('#pm-save').disabled=false;
});

// inputs carry data-p="path.to.field" inside a container with data-scope="bank"|"set"
function getRoot(scope){return scope==='bank'?S.bankEdit:S.setEdit}
function setPath(obj,path,val){const ks=path.split('.');let o=obj;for(let i=0;i<ks.length-1;i++)o=o[ks[i]];o[ks[ks.length-1]]=val}
function getPath(obj,path){return path.split('.').reduce((o,k)=>o==null?o:o[k],obj)}
function readInput(el){
  const t=el.dataset.t||'text';
  if(el.type==='checkbox'&&el.dataset.arr==null)return el.checked;
  const v=el.value;if(t==='num')return v===''?null:+v;if(t==='int')return v===''?null:parseInt(v,10);return v===''?null:v;
}
function onEdit(e){
  const box=e.target.closest('[data-scope]');if(!box)return;const scope=box.dataset.scope,root=getRoot(scope);if(!root)return;const el=e.target;
  if(el.dataset.arr!=null){const arr=getPath(root,el.dataset.arr)||[];const v=el.dataset.v;const has=arr.includes(v);if(el.checked&&!has)arr.push(v);if(!el.checked&&has)arr.splice(arr.indexOf(v),1);setPath(root,el.dataset.arr,arr)}
  else if(el.dataset.p)setPath(root,el.dataset.p,readInput(el));else return;
  if(scope==='bank')S.bankDirty=true;else S.setDirty=true;
  if(el.dataset.rr!=null&&e.type==='change'){const y=window.scrollY;scope==='bank'?vBanks():vSettings();window.scrollTo(0,y)}

function diffBank(o,n){
  const out=[],v=x=>x==null||x===''?'—':Array.isArray(x)?(x.map(y=>typeof y==='object'?(y.name||'')+' '+(y.value??''):({bullet:'دفعة واحدة',installments:'أقساط'}[y]||y)).join('، ')||'—'):x===true?'نعم':x===false?'لا':String(x);
  if(!o){out.push('إنشاء البنك');return out}
  for(const k in BANK_FIELDS)if(JSON.stringify(o[k]??null)!==JSON.stringify(n[k]??null))out.push(`${BANK_FIELDS[k]}: ${v(o[k])} ← ${v(n[k])}`);
  const om=Object.fromEntries((o.facilities||[]).map(f=>[f.id,f]));const nm=Object.fromEntries((n.facilities||[]).map(f=>[f.id,f]));
  for(const f of n.facilities||[]){const of=om[f.id];if(!of){out.push(`إضافة تسهيل «${f.label}» بحد ${fmt0(f.limit)}`);continue}
    for(const k in FAC_FIELDS)if(JSON.stringify(of[k]??null)!==JSON.stringify(f[k]??null))out.push(`«${f.label}» — ${FAC_FIELDS[k]}: ${v(of[k])} ← ${v(f[k])}`)}
  for(const f of o.facilities||[])if(!nm[f.id])out.push(`حذف تسهيل «${f.label}»`);
  return out;
}

    E.name=(E.name||'').trim();if(!E.name)return fail('اكتب اسم البنك.');

    for(const f of E.facilities){f.label=(f.label||'').trim();if(!f.label)return fail('كل تسهيل يحتاج اسماً.');if(!f.noLimit&&!(f.limit>=0))return fail(`حد «${f.label}» غير صحيح.`);
      if(!(f.repay||[]).length)return fail(`اختر طريقة سداد واحدة على الأقل لـ«${f.label}».`);
      if(f.parentId){let p=f.parentId,seen=new Set([f.id]);while(p){if(seen.has(p))return fail(`علاقة الحد الفرعي في «${f.label}» دائرية.`);seen.add(p);p=E.facilities.find(x=>x.id===p)?.parentId}}
      if(f.rateType==='benchmark'&&!f.benchmarkId)return fail(`اختر المؤشر لـ«${f.label}».`)}
    const old=bankById(E.id);const items=diffBank(old?Object.fromEntries(Object.entries(old).filter(([k])=>k!=='id')):null,E);

    if(await save([{col:'banks',id:E.id,doc}],'تم حفظ البنك')){S.bankDirty=false;S.bankEdit=null;vBanks()}
  }
});

/* ======================= Excel import ======================= */
const H=v=>String(v??'').replace(/\s+/g,' ').trim();
function xlDate(v){if(v==null||v==='')return null;if(typeof v==='number'){if(v<1)return null;return D(Math.round((v-25569)*864e5))}
  const t=String(v).trim();let m;if(m=t.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/))return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;if(m=t.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/))return `${m[3]}-${pad(m[2])}-${pad(m[1])}`;return 'bad'}
const xlNum=v=>v==null||v===''?null:typeof v==='number'?v:(isNaN(+String(v).replace(/[,\s]/g,''))?NaN:+String(v).replace(/[,\s]/g,''));
const yes=v=>/^(نعم|yes|y|true|1|✓)$/i.test(H(v));
function curCode(v){const t=H(v);if(!t)return null;const c=S.settings.currencies.find(c=>c.code.toUpperCase()===t.toUpperCase()||c.name===t||c.name.startsWith(t)||t.startsWith(c.name.split(' ')[0]));return c?c.code:(t==='ريال'?'SAR':t==='دولار'?'USD':t.toUpperCase())}
function sheetObjs(rows,need){
  const hi=rows.findIndex(r=>r&&need.every(n=>r.some(c=>H(c).startsWith(n))));if(hi<0)return null;
  const hdr=rows[hi].map(H);const col=n=>hdr.findIndex(h=>h.startsWith(n));
  return {col,rows:rows.slice(hi+1).map((r,i)=>({r:r||[],n:hi+i+2})).filter(x=>x.r.some(c=>c!=null&&H(c)!==''))};
}
function buildImport(file,sheets){
  const errs=[],warn=[];const names=Object.keys(sheets);
  const bs=names.find(n=>n.includes('البنوك')),ls=names.find(n=>n.includes('القروض'));
  if(!bs&&!ls)return{file,errs:['الملف لا يحتوي ورقة «البنوك والحدود» أو «القروض». استخدم نموذج الاستيراد.'],warn,banks:[],loans:[]};
  const banks=S.imp_mode==='replace'?[]:clone(S.banks).map(b=>({...b,_existing:true}));
  const findBank=name=>banks.find(b=>b.name===name);
  const typeFor=t=>{t=H(t);return S.settings.facilityTypes.find(x=>x.name===t)||S.settings.facilityTypes.find(x=>t&&(x.name.includes(t)||t.includes(x.name)))};
  const pending=[];
  if(bs){const o=sheetObjs(sheets[bs],['البنك','اسم التسهيل']);
    if(!o)errs.push(`ورقة «${bs}»: لم أجد صف العناوين (البنك، اسم التسهيل…).`);
    else{const c=o.col;o.rows.forEach(({r,n})=>{const bn=H(r[c('البنك')]),fl=H(r[c('اسم التسهيل')]);
      if(!bn||!fl){errs.push(`البنوك، صف ${n}: البنك واسم التسهيل مطلوبان.`);return}
      const ty=typeFor(r[c('نوع التسهيل')]);if(!ty){errs.push(`البنوك، صف ${n}: نوع التسهيل «${H(r[c('نوع التسهيل')])}» غير معروف. الأنواع: ${S.settings.facilityTypes.map(t=>t.name).join('، ')}.`);return}
      const noLim=yes(r[c('بدون سقف')]),lim=xlNum(r[c('الحد')]);if(!noLim&&(lim==null||isNaN(lim))){errs.push(`البنوك، صف ${n}: الحد غير صحيح.`);return}
      let b=findBank(bn);if(!b){b={id:rid('b'),name:bn,active:true,agreementNo:null,startDate:null,renewalDate:null,contact:null,basis:360,shiftRule:'default',notes:null,facilities:[],changeLog:[],order:banks.length+1};banks.push(b)}
      let f=b.facilities.find(x=>x.label===fl);const isNew=!f;if(!f){f=newFacility();f.label=fl;b.facilities.push(f)}
      f.typeId=ty.id;f.noLimit=noLim;f.limit=noLim?0:lim;const cc=curCode(r[c('عملة الحد')]);if(cc)f.currency=cc;
      if(isNew){if(ty.behavior==='lc'){f.repay=['bullet'];f.maxInstallments=1;f.maxUnit='d';f.defaultUnit='d';f.maxTenor=120;f.defaultTenor=120;f.lcDays=120;f.currency=cc||'USD'}if(ty.behavior==='long'){f.repay=['installments'];f.maxTenor=null;f.maxInstallments=null;f.defaultTenor=36}}
      const mt=xlNum(r[c('أقصى مدة')]);if(mt){f.maxTenor=mt;f.maxUnit='m';if(ty.behavior!=='lc'){f.defaultTenor=Math.min(f.defaultTenor||mt,mt)}}

    if(!o)errs.push(`ورقة «${ls}»: لم أجد صف العناوين (البنك، البيان…).`);

        const cc=curCode(r[c('العملة')])||baseCur(),fc=xlNum(r[c('المبلغ بالعملة')]),fx=xlNum(r[c('سعر الصرف')])||cur(cc)?.rate||1;
        if((pr==null||pr==='')&&fc)pr=r2(fc*fx);

        const key=b.id+'|'+nm;if(!groups.has(key))groups.set(key,{b,f,nm,long:/طويل|long/i.test(H(r[c('أجل القرض')])),ref:H(r[c('رقم حساب التمويل')])||null,master:H(r[c('رقم الاعتماد')])||null,start:st,cc,fx,fc:0,lines:[]});

      });
      const existing=new Set(S.imp_mode==='replace'?[]:S.loans.map(l=>l.bankId+'|'+l.name));let dup=0;
      groups.forEach((g,key)=>{if(existing.has(key)){dup++;return}g.lines.sort((a,b)=>a.due<b.due?-1:1);const beh=g.long?'long':behaviorOf(g.f.typeId);
        loans.push({term:beh==='long'?'long':'short',behavior:beh,bankId:g.b.id,bank:g.b.name,facilityId:g.f.id,limitId:g.f.id,facility:g.f.label,name:g.nm,ref:g.ref,master:beh==='lc'?g.master:null,
          start:g.start,currency:g.cc,fxRate:g.cc===baseCur()?1:g.fx,amountFC:g.cc===baseCur()?null:(g.fc||null),repay:g.lines.length>1?'installments':'bullet',terms:null,fees:null,custom:{},notes:null,

  if(area){$('#printArea').innerHTML=area;document.body.classList.add('pa')}
  const fname=(title.replace(/[\\/:*?"<>|]/g,'-')+'-'+todayStr()+'.pdf');
  try{if(mode==='pdf'){if(await window.api.printPDF(fname,land))toast('تم حفظ ملف PDF')}else await window.api.print(land)}
  catch(e){toast('تعذّرت الطباعة: '+e.message)}
  finally{document.body.classList.remove('pa');$('#printArea').innerHTML='';$('#printHead').innerHTML=''}
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-print]');if(b){e.stopPropagation();doPrint(b.dataset.print,b.dataset.what,b.dataset.id)}},true);
/* أرقام إنجليزية في حقول الأرقام والتواريخ */
new MutationObserver(()=>document.querySelectorAll('input[type=number]:not([lang]),input[type=date]:not([lang]),input[type=month]:not([lang])').forEach(i=>i.lang='en')).observe(document.body,{childList:true,subtree:true});

/* ======================= boot ======================= */
(async()=>{
  try{
    const r=await window.api.load();S.user=r.user;S.dataDir=r.dataDir;S.loginItem=r.loginItem;applyData(r.data);render();
    window.api.onChanged(d=>{applyData(d);refresh();toast('تم تحديث البيانات من جهاز آخر')});
    if(S.settings.notifyOnStart&&!S.notified){S.notified=true;const t=todayStr(),o=dueLines(l=>l.due<t),u=dueLines(l=>l.due>=t&&days(t,l.due)<=S.settings.urgentDays),rn=renewalAlerts().filter(x=>x.d<=0);
      const parts=[];if(o.length)parts.push(o.length+' استحقاق متأخر');if(u.length)parts.push(u.length+' استحقاق خلال '+S.settings.urgentDays+' أيام');if(rn.length)parts.push(rn.length+' اتفاقية منتهية');
      if(parts.length)window.api.notify('تنبيهات التسهيلات البنكية',parts.join('، ')).catch(()=>{})}
  }catch(e){$('#view').innerHTML=`<section class="panel"><div class="msg bad">تعذّر فتح البيانات: ${esc(e.message)}</div></section>`}
})();
</script>
